# Sample config for Prometheus.

global:
  scrape_interval:     15s # Set the scrape interval to every 15 seconds. Default is every 1 minute.
  evaluation_interval: 15s # Evaluate rules every 15 seconds. The default is every 1 minute.
  # scrape_timeout is set to the global default (10s).

  # Attach these labels to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager).
  external_labels:
      monitor: 'homebridge'
      location: 'home'
# Alertmanager configuration
alerting:
  alertmanagers:
  - static_configs:
    - targets: ['localhost:9093']

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
  - "rules/pihole-alerts.yml"
  - "rules/slo-rules.yml"
  - "alerts.yml"
  - "rules/cadvisor-alerts.yml"
  - "rules/k3s-alerts.yml"
  - "rules/blackbox-alerts.yml"
  - "rules/argocd-alerts.yml"
  - "rules/thanos-alerts.yml"
  - "rules/riverbot-alerts.yml"
  - "rules/prometheus-alerts.yml"
# A scrape configuration containing exactly one endpoint to scrape:
# Here it's Prometheus itself.
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: 'prometheus'

    # Override the global default and scrape targets from this job every 5 seconds.
    scrape_interval: 5s
    scrape_timeout: 5s

    # metrics_path defaults to '/metrics'
    # scheme defaults to 'http'.

    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['localhost:8080']

  - job_name: 'kube-state-metrics'
    static_configs:
      - targets: ['localhost:30809']

  - job_name: 'argocd'
    static_configs:
      - targets: ['localhost:30810']

  - job_name: node
    # If prometheus-node-exporter is installed, grab stats about the local
    # machine by default.
    static_configs:
      - targets: ['localhost:9100']
        labels:
          instance: "Raspberry Pi 5"

  - job_name: 'pihole'
    static_configs:
      - targets: ['localhost:9666']

  - job_name: 'bridge'
    static_configs:
      - targets: ['localhost:30119']

  - job_name: 'wc2026bot'
    static_configs:
      - targets: ['localhost:30120']

  - job_name: 'riverbot'
    static_configs:
      - targets: ['localhost:30121']

  - job_name: 'blackbox-homelab-https'
    metrics_path: /probe
    params:
      module: [https_homelab]
    static_configs:
      - targets:
          - https://argocd.homelab.local
          - https://grafana.homelab.local
          - https://uptime.homelab.local
          - https://homebridge.homelab.local
          - https://influxdb.homelab.local
          - https://pihole.homelab.local
          - https://cadvisor.homelab.local
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: localhost:9115

  - job_name: 'blackbox-external-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: localhost:9115
    static_configs:
      - targets:
          - https://waterservices.usgs.gov/nwis/iv/?sites=11446500&parameterCd=00060&format=json&period=PT1H
        labels:
          river: american_river
      - targets:
          - https://waterservices.usgs.gov/nwis/iv/?sites=11447650&parameterCd=00060&format=json&period=PT1H
        labels:
          river: sacramento_river

  - job_name: 'thanos-sidecar'
    static_configs:
      - targets: ['localhost:19191']

  - job_name: 'thanos-store'
    static_configs:
      - targets: ['localhost:19192']

  - job_name: 'thanos-query'
    static_configs:
      - targets: ['localhost:19193']

  - job_name: 'thanos-compact'
    static_configs:
      - targets: ['localhost:19194'] 

  - job_name: 'blackbox-dns-homelab'
    metrics_path: /probe
    params:
      module: [dns_pihole_homelab]
    static_configs:
      - targets:
          - 127.0.0.1:53
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: localhost:9115

  - job_name: 'demo-app'
    static_configs:
      - targets: ['localhost:30130']
