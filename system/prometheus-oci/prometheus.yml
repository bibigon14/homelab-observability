- job_name: blackbox-dns-homelab
  metrics_path: /probe
  params:
    module:
    - dns_pihole_homelab
  static_configs:
  - targets:
    - 10.0.0.1:53
  relabel_configs:
  - source_labels:
    - __address__
    target_label: __param_target
  - source_labels:
    - __param_target
    target_label: instance
  - target_label: __address__
    replacement: 10.0.0.1:9115
- job_name: demo-app
  static_configs:
