- job_name: chaos-scheduler-operator
  static_configs:
  - targets:
    - 10.0.0.1:30190
    labels:
      app: chaos-scheduler-operator
  relabel_configs:
  - source_labels:
    - __address__
    regex: 10\.0\.0\.1:(.+)
    target_label: instance
    replacement: localhost:${1}
- job_name: ebpf-observer
  static_configs:
  - targets:
    - 10.0.0.4:9100
    labels:
      app: ebpf-tcp-observer
      instance: oci-sanjose
      transport: wireguard
  scrape_interval: 15s
  scrape_timeout: 10s
- job_name: traffic-gen
  scrape_interval: 15s
  static_configs:
  - targets:
    - 10.0.0.4:9102
    labels:
      app: traffic-gen
      instance: oci-sanjose
      transport: wireguard
