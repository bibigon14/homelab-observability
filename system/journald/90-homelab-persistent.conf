# Installed to /etc/systemd/journald.conf.d/90-homelab-persistent.conf
#
# Raspberry Pi OS ships /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf
# (Storage=volatile, SD-card wear protection). This host boots from NVMe, and
# volatile journals made post-incident analysis impossible: the Sep-15 switch
# to persistent never took effect because journald was not restarted, so all
# logs lived in /run until the 2026-11-21 reboot. The vendor file is also
# masked explicitly (symlink to /dev/null, see README.md).
[Journal]
Storage=persistent
SystemMaxUse=1G
SystemMaxFileSize=100M
MaxRetentionSec=30day
